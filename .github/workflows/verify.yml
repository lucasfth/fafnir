name: Verify
on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/assets/**'
  pull_request:
    # No paths-ignore here on purpose: main branch protection requires the
    # Verify test runs for every merge, so docs/asset-only PRs must start CI.
    # (Direct branch pushes of docs-only changes still skip below.)
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  GOFLAGS: -trimpath
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          check-latest: true
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/verify.yml
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/fafnir ./cmd/fafnir
      - run: sh test/built-cli-workflow.sh bin/fafnir
      - run: sh test/mock-credentials-workflow.sh bin/fafnir
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
